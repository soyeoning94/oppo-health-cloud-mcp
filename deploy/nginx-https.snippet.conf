# 拿到域名后，把这段并入 /opt/service-portal/nginx.conf 的 http { } 内。
# 需要先有证书：certbot certonly --standalone -d health.example.com
# 然后把 OPPO_HEALTH_PUBLIC_HOSTS 改成 health.example.com 并重启容器。

server {
    listen 443 ssl;
    http2 on;
    server_name health.example.com;

    ssl_certificate     /etc/letsencrypt/live/health.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/health.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location = /oppo-health {
        return 308 /oppo-health/;
    }

    location /oppo-health/ {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:9333/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /oppo-health;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
}
