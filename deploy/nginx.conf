user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 80;
    server_name 115.159.96.81;
    auth_basic "Server Portal";
    auth_basic_user_file /etc/nginx/private/htpasswd;
    add_header X-Content-Type-Options nosniff always;

    location = /oppo-health {
      auth_basic off;
      return 308 /oppo-health/;
    }

    location /oppo-health/ {
      auth_basic off;
      client_max_body_size 2m;
      proxy_pass http://127.0.0.1:9333/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /oppo-health;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      add_header Cache-Control "no-store" always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
    }

    location /portal-icons/ {
      alias /etc/nginx/icons/;
    }
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
